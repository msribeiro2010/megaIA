<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Gerenciar Jogos - Mega-Sena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #209869 0%, #1a7a52 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(32, 152, 105, 0.3);
        }

        h1 {
            color: #209869;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .jogo-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #209869;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .jogo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .concurso-info {
            font-weight: bold;
            color: #209869;
            font-size: 18px;
        }

        .data-info {
            color: #666;
            font-size: 14px;
        }

        .cartao {
            background-color: #209869;
            color: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .cartao:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(32, 152, 105, 0.3);
        }

        .numeros {
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        
        .cartao-label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-container input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .checkbox-container label {
            cursor: pointer;
            user-select: none;
        }

        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.apostado {
            background: #28a745;
            color: white;
        }

        .status.nao-apostado {
            background: #ffc107;
            color: #856404;
        }

        .status.conferido {
            background: #6c757d;
            color: white;
        }

        .btn {
            background: #209869;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #1a7a52;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(32, 152, 105, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-left: 4px solid #209869;
        }

        .alert.error {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
            border-left: 4px solid #ffc107;
        }

        .alert.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Gerenciar Jogos da Mega-Sena</h1>

        <div id="alert" class="alert"></div>

        <div id="jogos-container"></div>

        <button id="salvar" class="btn">💾 Salvar Alterações</button>
    </div>

    <script>
        let historico = [];

        // Carregar histórico de jogos
        async function carregarJogos() {
            try {
                const response = await fetch('historico_jogos.json');
                historico = await response.json();
                renderizarJogos();
            } catch (error) {
                mostrarAlerta('Erro ao carregar jogos: ' + error.message, 'error');
            }
        }

        // Renderizar jogos na interface
        function renderizarJogos() {
            const container = document.getElementById('jogos-container');

            if (!historico || historico.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>📭 Nenhum jogo cadastrado</h2>
                        <p>Os jogos gerados aparecerão aqui.</p>
                    </div>
                `;
                return;
            }

            // Ordenar por data (mais recentes primeiro)
            const jogosOrdenados = [...historico].reverse();

            container.innerHTML = jogosOrdenados.map((jogo, index) => {
                const indexReal = historico.length - 1 - index;
                const conferido = jogo.conferido;

                return `
                    <div class="jogo-card">
                        <div class="jogo-header">
                            <div>
                                <div class="concurso-info">
                                    🎰 Concurso ${jogo.numero_concurso || 'Não definido'}
                                </div>
                                <div class="data-info">
                                    Gerado em: ${jogo.data_envio_formatada}
                                    ${jogo.data_sorteio ? `• Sorteio: ${jogo.data_sorteio}` : ''}
                                </div>
                            </div>
                            ${conferido ?
                                '<span class="status conferido">✅ Conferido</span>' :
                                jogo.aposta_realizada ?
                                '<span class="status apostado">✅ Apostado</span>' :
                                '<span class="status nao-apostado">❌ Não apostado</span>'
                            }
                        </div>

                        ${jogo.cartoes.map((numeros, cartaoIndex) => `
                            <div class="cartao">
                                <div>
                                    <span class="cartao-label">Cartão ${cartaoIndex + 1}</span>
                                    <span class="numeros">
                                        ${numeros.map(n => String(n).padStart(2, '0')).join(' - ')}
                                    </span>
                                </div>
                            </div>
                        `).join('')}

                        ${!conferido ? `
                            <div class="checkbox-container" style="margin-top: 15px;">
                                <input
                                    type="checkbox"
                                    id="aposta-${indexReal}"
                                    ${jogo.aposta_realizada ? 'checked' : ''}
                                    onchange="marcarAposta(${indexReal}, this.checked)"
                                >
                                <label for="aposta-${indexReal}">
                                    <strong>✅ Marquei esta aposta na lotérica</strong>
                                </label>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Marcar/desmarcar aposta
        function marcarAposta(index, marcado) {
            historico[index].aposta_realizada = marcado;
        }

        // Salvar alterações
        async function salvarAlteracoes() {
            const btn = document.getElementById('salvar');
            btn.disabled = true;
            btn.textContent = '💾 Salvando...';

            try {
                // Salvar via Python helper
                const response = await fetch('salvar_jogos.py', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(historico)
                });

                if (response.ok) {
                    mostrarAlerta('✅ Alterações salvas com sucesso!', 'success');
                    setTimeout(() => location.reload(), 1500);
                } else {
                    throw new Error('Erro ao salvar');
                }
            } catch (error) {
                // Fallback: copiar JSON para clipboard
                const json = JSON.stringify(historico, null, 2);
                mostrarAlerta('⚠️ Copie o JSON abaixo e salve manualmente em historico_jogos.json', 'error');
                console.log(json);

                // Tentar copiar automaticamente
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(json);
                    mostrarAlerta('📋 JSON copiado! Cole em historico_jogos.json', 'success');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 Salvar Alterações';
            }
        }

        // Mostrar alerta
        function mostrarAlerta(mensagem, tipo) {
            const alert = document.getElementById('alert');
            alert.textContent = mensagem;
            alert.className = `alert ${tipo} show`;

            setTimeout(() => {
                alert.className = 'alert';
            }, 5000);
        }

        // Event listeners
        document.getElementById('salvar').addEventListener('click', salvarAlteracoes);

        // Carregar jogos ao iniciar
        carregarJogos();
    </script>
</body>
</html>

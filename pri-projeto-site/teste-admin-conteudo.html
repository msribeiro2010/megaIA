<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Admin Conteúdo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔍 Teste de Diagnóstico - Admin Conteúdo</h1>

    <div class="test-section">
        <h2>1. Verificando Supabase</h2>
        <div id="supabase-test"></div>
    </div>

    <div class="test-section">
        <h2>2. Verificando Tabela site_config</h2>
        <div id="table-test"></div>
    </div>

    <div class="test-section">
        <h2>3. Testando SiteConfigManager</h2>
        <div id="manager-test"></div>
    </div>

    <div class="test-section">
        <h2>4. Console de Erros</h2>
        <div id="console-errors"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/site-config.js"></script>

    <script>
        async function runTests() {
            const results = {
                supabase: document.getElementById('supabase-test'),
                table: document.getElementById('table-test'),
                manager: document.getElementById('manager-test'),
                errors: document.getElementById('console-errors')
            };

            // Aguardar Supabase carregar
            await new Promise(resolve => setTimeout(resolve, 500));

            // Capturar erros do console
            const consoleErrors = [];
            const originalError = console.error;
            console.error = function(...args) {
                consoleErrors.push(args.join(' '));
                originalError.apply(console, args);
            };

            // Test 1: Supabase
            try {
                const client = initSupabase();
                if (client) {
                    results.supabase.innerHTML = '<p class="success">✅ Supabase carregado</p>';
                    results.supabase.innerHTML += `<p class="info">URL: ${SUPABASE_CONFIG.url}</p>`;
                } else {
                    results.supabase.innerHTML = '<p class="error">❌ Supabase NÃO carregado</p>';
                }
            } catch (error) {
                results.supabase.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }

            // Test 2: Tabela site_config
            try {
                const client = initSupabase();
                const { data, error, count } = await client
                    .from('site_config')
                    .select('*', { count: 'exact' });

                if (error) {
                    results.table.innerHTML = `<p class="error">❌ Erro ao acessar tabela: ${error.message}</p>`;
                    results.table.innerHTML += `<p class="info">Código: ${error.code}</p>`;
                    results.table.innerHTML += `<p class="info">Detalhes: ${error.details || 'N/A'}</p>`;

                    if (error.message.includes('relation') && error.message.includes('does not exist')) {
                        results.table.innerHTML += '<p class="error"><strong>⚠️ SOLUÇÃO: Execute o arquivo supabase-site-config.sql no Supabase</strong></p>';
                    }
                } else {
                    results.table.innerHTML = `<p class="success">✅ Tabela existe e acessível</p>`;
                    results.table.innerHTML += `<p class="info">Total de registros: ${count}</p>`;

                    if (data && data.length > 0) {
                        results.table.innerHTML += '<p class="info">Configurações encontradas:</p><ul>';
                        data.forEach(config => {
                            results.table.innerHTML += `<li>${config.config_key}</li>`;
                        });
                        results.table.innerHTML += '</ul>';
                    }
                }
            } catch (error) {
                results.table.innerHTML = `<p class="error">❌ Erro inesperado: ${error.message}</p>`;
            }

            // Test 3: SiteConfigManager
            try {
                if (typeof SiteConfigManager !== 'undefined') {
                    results.manager.innerHTML = '<p class="success">✅ SiteConfigManager carregado</p>';

                    // Testar método getConfig
                    const heroConfig = await SiteConfigManager.getConfig('hero_section');
                    if (heroConfig) {
                        results.manager.innerHTML += '<p class="success">✅ Método getConfig() funcional</p>';
                        results.manager.innerHTML += `<p class="info">Hero Title: ${heroConfig.config_value.title || 'N/A'}</p>`;
                    } else {
                        results.manager.innerHTML += '<p class="error">❌ Nenhuma configuração hero encontrada</p>';
                    }
                } else {
                    results.manager.innerHTML = '<p class="error">❌ SiteConfigManager NÃO carregado</p>';
                }
            } catch (error) {
                results.manager.innerHTML = `<p class="error">❌ Erro: ${error.message}</p>`;
            }

            // Mostrar erros do console
            if (consoleErrors.length > 0) {
                results.errors.innerHTML = '<p class="error">Erros encontrados:</p><ul>';
                consoleErrors.forEach(err => {
                    results.errors.innerHTML += `<li>${err}</li>`;
                });
                results.errors.innerHTML += '</ul>';
            } else {
                results.errors.innerHTML = '<p class="success">✅ Nenhum erro no console</p>';
            }
        }

        // Executar testes após página carregar
        window.addEventListener('load', () => {
            setTimeout(runTests, 500);
        });
    </script>
</body>
</html>

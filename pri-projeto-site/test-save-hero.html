<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Salvar Hero</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Teste de Salvamento Hero</h1>
    
    <button onclick="testSave()">🧪 Testar Salvar Hero</button>
    <button onclick="testLoad()">📖 Testar Carregar Hero</button>
    <button onclick="clearLogs()">🗑️ Limpar Logs</button>
    
    <div id="logs"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/site-config.js"></script>
    
    <script>
        const logsDiv = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const p = document.createElement('pre');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(p);
            console.log(message);
        }
        
        function clearLogs() {
            logsDiv.innerHTML = '';
        }
        
        async function testSave() {
            log('=== TESTE DE SALVAMENTO ===');
            
            const testData = {
                title: "Teste Hero " + Date.now(),
                subtitle: "Subtítulo de teste",
                button_primary_text: "Botão Primário",
                button_primary_link: "#test",
                button_secondary_text: "Botão Secundário",
                button_secondary_link: "#test2",
                overlay_opacity: 0.7,
                use_hero_image: true,
                background_images: [
                    "https://via.placeholder.com/1920x1080/2d7a4d/ffffff?text=Teste+Hero+1",
                    "https://via.placeholder.com/1920x1080/4a9d6f/ffffff?text=Teste+Hero+2"
                ],
                main_image_index: 0
            };
            
            log('📝 Dados de teste: ' + JSON.stringify(testData, null, 2));
            
            try {
                const result = await SiteConfigManager.saveConfig('hero_section', testData);
                
                if (result.success) {
                    log('✅ SUCESSO! Dados salvos', 'success');
                    log('📦 Resultado: ' + JSON.stringify(result, null, 2), 'success');
                } else {
                    log('❌ ERRO ao salvar: ' + result.error, 'error');
                }
            } catch (error) {
                log('❌ EXCEÇÃO: ' + error.message, 'error');
                log('Stack: ' + error.stack, 'error');
            }
        }
        
        async function testLoad() {
            log('=== TESTE DE CARREGAMENTO ===');
            
            try {
                const config = await SiteConfigManager.getConfig('hero_section');
                
                if (config) {
                    log('✅ Configuração carregada', 'success');
                    log('📦 config_key: ' + config.config_key, 'success');
                    log('📦 config_value: ' + JSON.stringify(config.config_value, null, 2), 'success');
                } else {
                    log('⚠️ Nenhuma configuração encontrada', 'error');
                }
            } catch (error) {
                log('❌ ERRO ao carregar: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
